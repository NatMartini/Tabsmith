[package]
name = "predict-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "A tiny Rust application that loads a Tabsmith bundle. Depends only on tabsmith-runtime."

# Standalone on purpose (not a workspace member): `cargo tree` here shows the full
# dependency set an application pays for — no Burn, no Polars, no Python.
[workspace]

[dependencies]
tabsmith-runtime = { path = "../../crates/tabsmith-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
