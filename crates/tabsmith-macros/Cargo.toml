[package]
name = "tabsmith-macros"
description = "Compiles a Tabsmith bundle into Rust code at build time: typed inputs and outputs, and no_std inference that predicts exactly what the runtime predicts."
version.workspace = true
edition.workspace = true
# The floor of tabsmith-runtime, which loads and verifies the bundle at expansion time.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["machine-learning", "proc-macro", "no-std", "embedded", "tabular"]
categories = ["development-tools::procedural-macro-helpers", "embedded", "science"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
proc-macro = true

[dependencies]
tabsmith-contracts.workspace = true
tabsmith-runtime.workspace = true
serde_json.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
tabsmith-embedded.workspace = true
syn = { workspace = true, features = ["full"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
