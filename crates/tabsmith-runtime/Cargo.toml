[package]
name = "tabsmith-runtime"
description = "Lightweight Tabsmith prediction runtime: bundle verification, frozen preprocessing, model execution."
version.workspace = true
edition.workspace = true
# Lower than the workspace minimum: applications that only load bundles do not pay
# for Burn or Polars. 1.88 is the floor set by sha2 0.11; checked by the `msrv` CI job.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["machine-learning", "inference", "tabular", "classification", "prediction"]
categories = ["science"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
tabsmith-contracts.workspace = true
tabsmith-embedded.workspace = true
serde.workspace = true
serde_json.workspace = true
safetensors.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
