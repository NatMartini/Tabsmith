[package]
name = "rustpy-workflow"
description = "RustPy workflow core: data snapshots, splits, fitted preprocessing, training, evaluation, bundles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["machine-learning", "training", "tabular", "classification", "burn"]
categories = ["science"]
# Integration tests and examples stay in the repository: some read fixtures from
# ../../fixtures, which a published package cannot contain.
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
rustpy-contracts.workspace = true
rustpy-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
safetensors.workspace = true
polars.workspace = true
burn.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
