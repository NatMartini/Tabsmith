[workspace]
resolver = "3"
members = [
    "crates/rustpy-contracts",
    "crates/rustpy-runtime",
    "crates/rustpy-workflow",
    "crates/rustpy-cli",
]
# The predict-app example is a standalone package on purpose: it proves the
# runtime-only dependency tree (no Burn, no Polars, no training CLI).
exclude = ["examples/predict-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version of the workspace: Burn 0.22.1 declares 1.95, the
# highest requirement in the dependency graph. rustpy-contracts and rustpy-runtime
# override this with their own (lower) minimum. Both are checked by the `msrv` CI job.
rust-version = "1.95"
authors = ["RustPy contributors"]
# `repository` and `homepage` are inserted after `license` by tools/release/set-repo.sh OWNER/REPO.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustpy-contracts = { path = "crates/rustpy-contracts", version = "0.1.0" }
rustpy-runtime = { path = "crates/rustpy-runtime", version = "0.1.0" }
rustpy-workflow = { path = "crates/rustpy-workflow", version = "0.1.0" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
toml = "0.9.8"
toml_edit = "0.23.9"
thiserror = "2.0.17"
sha2 = "0.11.1"
safetensors = "0.8.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
tempfile = "3.27.0"
polars = { version = "=0.55.2", default-features = false, features = ["csv", "parquet"] }
burn = { version = "=0.22.1", default-features = false, features = ["std", "ndarray", "autodiff", "optim"] }

[profile.release]
# Distribution profile for the prebuilt `rustpy` binaries (see .github/workflows/release.yml).
# Thin LTO with one codegen unit per crate keeps most of the size/speed gain of fat
# LTO while bounding link time and memory for the Polars + Burn dependency graph on
# CI runners. `strip` removes symbol tables: panics still report file:line, but
# backtraces show no function names.
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Keep debug builds small: line tables are enough for backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies (Burn, Polars, ndarray) are much faster when optimized even in dev builds.
opt-level = 2
debug = false
