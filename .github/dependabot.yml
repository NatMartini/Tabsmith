version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions (and, for 0.x crates, minor versions) change APIs. They are
    # upgraded by hand; the `audit` CI job still reports advisories against them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Routine minor/patch updates in one pull request. Burn and Polars are pinned
      # with `=` on purpose (the engine version is recorded in every run, and exact
      # resume assumes the same engine) and are upgraded deliberately, so their
      # updates arrive as separate pull requests.
      cargo-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["burn*", "polars*"]
        update-types: [minor, patch]

  # Standalone package with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: /examples/predict-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      predict-app:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
