name: Bug report
description: Something does not work as documented. / 功能与文档不符。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** report security problems here; see SECURITY.md.
        感谢反馈。安全问题请勿在此提交，请参阅 SECURITY.md。

  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 发生了什么？
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: |
        The exact commands, ideally starting from `tabsmith init --sample-data` or a small
        data file you can share. For library use, a minimal Rust snippet.
      placeholder: |
        tabsmith init demo --sample-data
        cd demo
        tabsmith run
        ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output / 输出
      description: The full error (the multi-line report, or the `--json` output). This is rendered as code.
      render: text

  - type: textarea
    id: doctor
    attributes:
      label: tabsmith --version and tabsmith doctor
      description: Paste the output of `tabsmith --version` and `tabsmith doctor`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Linux x86_64
        - Linux aarch64
        - macOS Apple Silicon
        - macOS Intel
        - Windows x86_64
        - Other (describe above)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was tabsmith installed? / 安装方式
      options:
        - install.sh / install.ps1 (prebuilt binary)
        - cargo binstall
        - cargo install tabsmith-cli
        - Built from a git checkout
        - Using the crates as a library
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for this problem.
          required: true
